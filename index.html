<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline Study App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1d24">
<style>
  :root {
    --bg-color: #0b0d12;
    --card-color: #131720;
    --text-main: #f2f4f8;
    --text-muted: #9aa4b5;
    --accent: #8b7cff;
    --thick-outline: #242936;
    --danger: #ff6577;
    --green: #4fd18b;
    --casio-body: #161920;
    --casio-screen: #d7e2cb;
    --casio-screen-text: #111;
    --casio-btn: #262c38;
    --casio-btn-shift: #eab308;
    --casio-btn-alpha: #ec4899;
    --casio-btn-ac: #22c55e;
  }
  
  * { box-sizing: border-box; font-family: sans-serif; }
  
  body {
    margin: 0; padding: 0 0 80px 0;
    background-color: var(--bg-color); color: var(--text-main);
  }

  .card {
    background: var(--card-color);
    border: 3px solid var(--thick-outline);
    border-radius: 12px;
    padding: 16px;
    margin: 12px 16px;
    box-shadow: 4px 4px 0px var(--thick-outline);
    position: relative;
  }

  .btn {
    display: block; width: 100%;
    background: var(--card-color); color: var(--text-main);
    border: 3px solid var(--thick-outline);
    border-radius: 10px; padding: 12px;
    font-weight: bold; font-size: 1rem;
    cursor: pointer; transition: 0.1s;
    box-shadow: 3px 3px 0px var(--thick-outline);
    margin-top: 10px;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px transparent; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 3px 3px 0px #5a4bcf; }
  .btn-danger { background: var(--card-color); color: var(--danger); border-color: var(--danger); box-shadow: 3px 3px 0px #b33949; }
  .btn-success { background: var(--card-color); color: var(--green); border-color: var(--green); box-shadow: 3px 3px 0px #2f855a; }

  header {
    padding: 18px 16px;
    border-bottom: 3px solid var(--thick-outline);
    background: var(--bg-color);
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }

  input, textarea {
    width: 100%; background: var(--bg-color); color: var(--text-main);
    border: 3px solid var(--thick-outline); border-radius: 8px;
    padding: 12px; font-size: 1rem; outline: none;
    margin-bottom: 12px; resize: vertical;
  }
  input:focus, textarea:focus { border-color: var(--accent); }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; background: var(--card-color);
    border-top: 3px solid var(--thick-outline);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 50;
  }
  .nav-btn {
    flex: 1; padding: 14px 4px;
    background: transparent; border: none; border-right: 3px solid var(--thick-outline);
    color: var(--text-muted); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 0.75rem; font-weight: bold; text-transform: uppercase;
  }
  .nav-btn:last-child { border-right: none; }
  .nav-btn.active { color: var(--accent); background: rgba(139, 124, 255, 0.1); }
  .nav-icon { font-size: 1.4rem; }

  .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .title-row h3 { margin: 0; }
  .back-btn { background: none; border: none; color: var(--accent); font-weight: bold; font-size: 1rem; cursor: pointer; padding: 0; }
  
  /* Casio fx-350ES Plus Authentic Layout Styles */
  .casio-body {
    background: var(--casio-body); border: 3px solid #2b3342; border-radius: 16px;
    padding: 14px; max-width: 420px; margin: 12px auto; box-shadow: 6px 6px 0px var(--thick-outline);
  }
  .casio-brand-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px; padding: 0 4px; }
  .casio-logo { font-weight: 900; font-style: italic; font-size: 1.15rem; letter-spacing: 1px; color: #fff; }
  .casio-model { font-size: 0.75rem; color: var(--text-muted); font-weight: bold; }
  
  .casio-screen-box {
    background: var(--casio-screen); border: 3px solid #374151; border-radius: 8px;
    padding: 10px; margin-bottom: 12px; min-height: 75px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .casio-screen-top { font-size: 0.75rem; color: #4b5563; font-family: monospace; text-align: right; min-height: 16px; }
  .casio-screen-main { font-size: 1.4rem; color: var(--casio-screen-text); font-family: monospace; text-align: right; font-weight: bold; outline: none; border: none; background: transparent; width: 100%; }

  .casio-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .c-btn {
    background: var(--casio-btn); color: #fff; border: 2px solid #111; border-radius: 6px;
    padding: 10px 0; font-size: 0.8rem; font-weight: bold; cursor: pointer; text-align: center;
    box-shadow: 0 3px 0 #111; transition: 0.05s;
  }
  .c-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #111; }
  .c-btn-shift { color: #facc15; }
  .c-btn-alpha { color: #f472b6; }
  .c-btn-op { background: #1f2937; color: #93c5fd; }
  .c-btn-ac { background: #15803d; color: #fff; }
  .c-btn-del { background: #15803d; color: #fff; }
  .c-btn-equals { background: #4f46e5; color: #fff; }

  .quiz-option {
    background: var(--bg-color); border: 2px solid var(--thick-outline);
    padding: 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer;
    font-weight: bold; box-shadow: 2px 2px 0px var(--thick-outline);
  }
  .quiz-option.selected { border-color: var(--accent); background: rgba(139, 124, 255, 0.15); }
  .quiz-option.correct { border-color: var(--green); background: rgba(79, 209, 139, 0.2); color: var(--green); }
  .quiz-option.incorrect { border-color: var(--danger); background: rgba(255, 101, 119, 0.2); color: var(--danger); }

  .menu-container { position: relative; display: inline-block; }
  .dots-btn { background: none; border: none; color: var(--text-main); font-size: 1.4rem; font-weight: bold; cursor: pointer; padding: 0 6px; }
  .dropdown-menu {
    position: absolute; right: 0; top: 30px; background: var(--card-color);
    border: 3px solid var(--thick-outline); border-radius: 8px; z-index: 20;
    box-shadow: 3px 3px 0px var(--thick-outline); display: none; min-width: 110px;
  }
  .dropdown-menu.show { display: block; }
  .dropdown-item {
    padding: 10px 14px; font-size: 0.9rem; font-weight: bold; cursor: pointer;
    border-bottom: 2px solid var(--thick-outline); text-align: left; background: none; color: var(--text-main); width: 100%;
  }
  .dropdown-item:last-child { border-bottom: none; }
  .dropdown-item:hover { background: rgba(139, 124, 255, 0.15); }
</style>
</head>
<body>

<div id="app"></div>

<div class="bottom-nav">
  <button class="nav-btn" id="nav-calc" onclick="setTab('calculator')">
    <span class="nav-icon">🖩</span><span>Calc</span>
  </button>
  <button class="nav-btn active" id="nav-sub" onclick="setTab('subjects')">
    <span class="nav-icon">📓</span><span>Topics</span>
  </button>
  <button class="nav-btn" id="nav-set" onclick="setTab('settings')">
    <span class="nav-icon">⚙️</span><span>Settings</span>
  </button>
</div>
<script>
  let currentTab = 'subjects';
  let viewStack = ['topicList'];
  let activeTopicId = null;
  let openMenuTopicId = null;
  
  let bulkPasteText = '';
  
  let quizIndex = 0;
  let quizSelectedOpt = null;
  let quizScore = 0;
  let quizAnswered = false;

  let db = JSON.parse(localStorage.getItem('study_app_data_v3')) || { topics: [] };

  function saveData() {
    localStorage.setItem('study_app_data_v3', JSON.stringify(db));
  }

  function setTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    if(tab === 'calculator') document.getElementById('nav-calc').classList.add('active');
    if(tab === 'subjects') {
      document.getElementById('nav-sub').classList.add('active');
      viewStack = ['topicList'];
    }
    if(tab === 'settings') document.getElementById('nav-set').classList.add('active');
    render();
  }

  function goBack() {
    if (viewStack.length > 1) {
      viewStack.pop();
      render();
    }
  }

  function addTopic() {
    const name = prompt('Enter new topic name:');
    if (name && name.trim() !== '') {
      const newTopic = { id: Date.now().toString(), name: name.trim(), quiz: [] };
      db.topics.push(newTopic);
      activeTopicId = newTopic.id;
      viewStack.push('topicDetail');
      saveData();
      render();
    }
  }

  function toggleMenu(topicId, event) {
    event.stopPropagation();
    openMenuTopicId = (openMenuTopicId === topicId) ? null : topicId;
    render();
  }

  function editTopic(topicId, event) {
    event.stopPropagation();
    openMenuTopicId = null;
    activeTopicId = topicId;
    viewStack.push('topicDetail');
    render();
  }

  function deleteTopic(topicId, event) {
    event.stopPropagation();
    openMenuTopicId = null;
    if (confirm('Delete this topic?')) {
      db.topics = db.topics.filter(t => t.id !== topicId);
      saveData();
      render();
    }
  }

  function handleTopicClick(topicId) {
    const topic = db.topics.find(t => t.id === topicId);
    activeTopicId = topicId;
    
    if (topic.quiz.length === 0) {
      viewStack.push('topicDetail');
    } else {
      quizIndex = 0;
      quizScore = 0;
      quizSelectedOpt = null;
      quizAnswered = false;
      viewStack.push('takeQuiz');
    }
    render();
  }

  function parseAndImportQuestions(topicId) {
    const lines = bulkPasteText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length);
    const qRe = /^(\d{1,3})[\.\)]\s*(.+)/;
    const optRe = /^([A-Da-d])[\.\)]\s*(.+)/;
    const markers = ['✅','✔️','✔','✓'];

    const parsedQuestions = [];
    let current = null;

    function finalize(c){
      if(!c || !c.question || c.options.length < 2) return null;
      let correctIndex = c.options.findIndex(o => o.isCorrect);
      if(correctIndex === -1) correctIndex = 0;
      return { question: c.question, options: c.options.map(o => o.text), correctIndex };
    }

    for(const line of lines){
      const optMatch = line.match(optRe);
      const qMatch = !optMatch ? line.match(qRe) : null;

      if(qMatch){
        const done = finalize(current);
        if(done) parsedQuestions.push(done);
        current = { question: qMatch[2].trim(), options: [] };
        continue;
      }
      if(optMatch && current){
        let text = optMatch[2].trim();
        let isCorrect = false;
        for(const m of markers){
          if(text.includes(m)){ isCorrect = true; text = text.split(m)[0].trim(); }
        }
        if(/\(correct\)/i.test(text)){ isCorrect = true; text = text.replace(/\(correct\)/i,'').trim(); }
        if(text) current.options.push({ text, isCorrect });
      }
    }
    const done = finalize(current);
    if(done) parsedQuestions.push(done);

    if(parsedQuestions.length === 0) {
      alert('Could not parse questions. Ensure they are numbered (1., 2.) with options (A., B., C., D.) and a symbol like ✅ on the correct answer.');
      return;
    }

    const topic = db.topics.find(t => t.id === topicId);
    topic.quiz.push(...parsedQuestions);
    bulkPasteText = '';
    saveData();
    alert(`Successfully imported ${parsedQuestions.length} question(s)!`);
    render();
  }

  function deleteQuestion(index) {
    const topic = db.topics.find(t => t.id === activeTopicId);
    topic.quiz.splice(index, 1);
    saveData();
    render();
  }

  function startQuizSession() {
    const topic = db.topics.find(t => t.id === activeTopicId);
    if (topic.quiz.length === 0) {
      alert('Add at least one question before taking the quiz!');
      return;
    }
    quizIndex = 0;
    quizScore = 0;
    quizSelectedOpt = null;
    quizAnswered = false;
    viewStack.push('takeQuiz');
    render();
  }

  function render() {
    const app = document.getElementById('app');
    app.innerHTML = '';

    if (currentTab === 'calculator') {
      app.innerHTML = buildCalculator();
    } else if (currentTab === 'settings') {
      app.innerHTML = buildSettings();
    } else if (currentTab === 'subjects') {
      const currentView = viewStack[viewStack.length - 1];
      if (currentView === 'topicList') app.innerHTML += buildTopicList();
      if (currentView === 'topicDetail') app.innerHTML += buildTopicDetail();
      if (currentView === 'takeQuiz') app.innerHTML += buildQuizSession();
    }
  }

  function buildTopicList() {
    let html = `<header><div></div><h1>My Topics</h1><div></div></header>`;
    html += `<div style="padding: 0 4px;">`;
    
    if (db.topics.length === 0) {
      html += `<div class="card"><p style="text-align:center; color:var(--text-muted);">No topics yet. Tap below to create one!</p></div>`;
    } else {
      db.topics.forEach(top => {
        const isMenuOpen = openMenuTopicId === top.id;
        html += `
          <div class="card" onclick="handleTopicClick('${top.id}')" style="cursor:pointer;">
            <div class="title-row">
              <h3>${top.name}</h3>
              <div class="menu-container">
                <button class="dots-btn" onclick="toggleMenu('${top.id}', event)">⋮</button>
                <div class="dropdown-menu ${isMenuOpen ? 'show' : ''}">
                  <button class="dropdown-item" onclick="editTopic('${top.id}', event)">Edit</button>
                  <button class="dropdown-item" style="color:var(--danger);" onclick="deleteTopic('${top.id}', event)">Delete</button>
                </div>
              </div>
            </div>
            <div style="font-size:0.85rem; color:var(--text-muted);">${top.quiz.length} Quiz Questions</div>
          </div>
        `;
      });
    }
    html += `<div style="padding: 0 16px; margin-top: 16px;"><button class="btn btn-primary" onclick="addTopic()">+ Add Topic</button></div></div>`;
    return html;
  }

  function buildTopicDetail() {
    const topic = db.topics.find(t => t.id === activeTopicId);
    
    let html = `
      <div style="padding: 0 4px;">
        <div style="margin: 16px 16px 8px 16px; display:flex; justify-content:space-between; align-items:center;">
          <button class="back-btn" onclick="goBack()">◀ BACK TO TOPICS</button>
          <span style="font-size:0.85rem; color:var(--text-muted);">${topic.name}</span>
        </div>
      </div>
    `;
    
    if (topic.quiz.length > 0) {
      html += `
        <div class="card" style="background:var(--accent); border-color:#5a4bcf; color:#fff;">
          <h3 style="margin-bottom:6px;">Ready to Practice?</h3>
          <p style="margin:0 0 12px 0; font-size:0.9rem; opacity:0.9;">Take the interactive quiz for this topic (${topic.quiz.length} questions available).</p>
          <button class="btn" style="background:#fff; color:var(--accent); border-color:#fff;" onclick="startQuizSession()">🚀 Take Quiz Now</button>
        </div>
      `;
    }

    html += `
      <div class="card">
        <h3>Paste AI Quiz Questions</h3>
        <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:10px;">Paste questions formatted with numbered queries and options A–D. Mark the correct answer with ✅ or ✓.</p>
        <textarea rows="6" placeholder="1. What is 2 + 2?\nA. 3\nB. 4 ✅\nC. 5\nD. 6" oninput="bulkPasteText=this.value">${bulkPasteText}</textarea>
        <button class="btn btn-success" onclick="parseAndImportQuestions('${topic.id}')">Import Pasted Questions</button>
      </div>
    `;

    html += `<div class="card"><h3>Manage Quiz Questions (${topic.quiz.length})</h3>`;
    if (topic.quiz.length > 0) {
      topic.quiz.forEach((q, idx) => {
        html += `
          <div style="background:var(--bg-color); border:2px solid var(--thick-outline); padding:10px; border-radius:8px; margin-bottom:10px;">
            <div style="display:flex; justify-content:space-between; align-items:start;">
              <strong>Q${idx + 1}: ${q.question}</strong>
              <button class="btn btn-danger" style="width:auto; padding:4px 8px; margin:0; font-size:0.8rem;" onclick="deleteQuestion(${idx})">X</button>
            </div>
            <ul style="margin:6px 0 0 16px; padding:0; font-size:0.9rem; color:var(--text-muted);">
              ${q.options.map((opt, oIdx) => `<li style="color:${oIdx === q.correctIndex ? 'var(--green)' : 'inherit'};">${opt} ${oIdx === q.correctIndex ? '(Correct)' : ''}</li>`).join('')}
            </ul>
          </div>
        `;
      });
    } else {
      html += `<p style="color:var(--text-muted); font-size:0.9rem;">No questions added yet. Paste some above!</p>`;
    }
    html += `</div>`;

    return html;
  }

  function buildQuizSession() {
    const topic = db.topics.find(t => t.id === activeTopicId);

    if (quizIndex >= topic.quiz.length) {
      const percentage = Math.round((quizScore / topic.quiz.length) * 100);
      return `
        <div style="padding: 0 4px;">
          <div style="margin: 16px 16px 8px 16px;"><button class="back-btn" onclick="goBack()">◀ BACK TO TOPIC</button></div>
          <div class="card" style="text-align:center;">
            <h2>Quiz Complete! 🎉</h2>
            <p style="font-size: 1.5rem; font-weight:bold; color:var(--accent); margin: 20px 0;">Score: ${quizScore} / ${topic.quiz.length} (${percentage}%)</p>
            <button class="btn btn-primary" onclick="startQuizSession()">Retake Quiz</button>
            <button class="btn" style="margin-top:10px;" onclick="goBack()">Back to Topic</button>
          </div>
        </div>
      `;
    }

    const q = topic.quiz[quizIndex];
    let html = `
      <div style="padding: 0 4px;">
        <div style="margin: 16px 16px 8px 16px; display:flex; justify-content:space-between; align-items:center;">
          <button class="back-btn" onclick="goBack()">◀ QUIT QUIZ</button>
          <span style="font-size:0.85rem; color:var(--text-muted);">Question ${quizIndex + 1} of ${topic.quiz.length}</span>
        </div>
        <div class="card">
          <h3 style="margin-bottom:16px; font-size:1.1rem; line-height:1.4;">${q.question}</h3>
    `;

    q.options.forEach((opt, idx) => {
      let optClass = 'quiz-option';
      if (quizAnswered) {
        if (idx === q.correctIndex) optClass += ' correct';
        else if (idx === quizSelectedOpt) optClass += ' incorrect';
      } else if (quizSelectedOpt === idx) {
        optClass += ' selected';
      }

      html += `<div class="${optClass}" onclick="${quizAnswered ? '' : `quizSelectedOpt=${idx}; render();`}">${String.fromCharCode(65 + idx)}. ${opt}</div>`;
    });

    if (!quizAnswered) {
      html += `<button class="btn btn-primary" style="margin-top:16px;" ${quizSelectedOpt === null ? 'disabled style="opacity:0.5;"' : ''} onclick="submitQuizAnswer()">Submit Answer</button>`;
    } else {
      html += `<button class="btn btn-primary" style="margin-top:16px;" onclick="nextQuizQuestion()">Next Question ➔</button>`;
    }

    html += `</div></div>`;
    return html;
  }

  function submitQuizAnswer() {
    if (quizSelectedOpt === null) return;
    const topic = db.topics.find(t => t.id === activeTopicId);
    const q = topic.quiz[quizIndex];

    if (quizSelectedOpt === q.correctIndex) {
      quizScore++;
    }
    quizAnswered = true;
    render();
  }

  function nextQuizQuestion() {
    quizIndex++;
    quizSelectedOpt = null;
    quizAnswered = false;
    render();
  }

  // Casio fx-350ES Plus Layout-Exact Scientific Calculator Logic
  function buildCalculator() {
    let html = `
      <div class="casio-body">
        <div class="casio-brand-row">
          <span class="casio-logo">CASIO</span>
          <span class="casio-model">fx-350ES PLUS</span>
        </div>
        
        <div class="casio-screen-box">
          <div class="casio-screen-top" id="calc-top">Math</div>
          <input type="text" class="casio-screen-main" id="calc-display" readonly value="${calcExpr || '0'}">
        </div>

        <div class="casio-grid">
          <!-- Row 1: Shift, Alpha, Mode, etc. -->
          <button class="c-btn c-btn-shift">SHIFT</button>
          <button class="c-btn c-btn-alpha">ALPHA</button>
          <button class="c-btn" style="grid-column: span 2; font-size: 0.7rem;" onclick="calcClear()">MODE SETUP</button>
          <button class="c-btn" style="background:#b91c1c; color:#fff;" onclick="calcClear()">ON</button>

          <!-- Row 2 -->
          <button class="c-btn" onclick="calcAppend('Math.abs(')">Abs</button>
          <button class="c-btn" onclick="calcAppend('**3')">x³</button>
          <button class="c-btn" onclick="calcAppend('**(-1)')">x⁻¹</button>
          <button class="c-btn" onclick="calcAppend('Math.log10(')">log</button>
          <button class="c-btn" onclick="calcAppend('Math.log(')">ln</button>

          <!-- Row 3 -->
          <button class="c-btn" onclick="calcAppend('Math.sqrt(')">√</button>
          <button class="c-btn" onclick="calcAppend('**2')">x²</button>
          <button class="c-btn" onclick="calcAppend('**')">x^y</button>
          <button class="c-btn" onclick="calcAppend('Math.log(')">log_</button>
          <button class="c-btn" onclick="calcAppend('Math.exp(1)')">eˣ</button>

          <!-- Row 4 -->
          <button class="c-btn" onclick="calcAppend('(-')">(-)</button>
          <button class="c-btn" onclick="calcAppend('deg')">° ’ ”</button>
          <button class="c-btn" onclick="calcAppend('hyp')">hyp</button>
          <button class="c-btn" onclick="calcAppend('Math.sin(')">sin</button>
          <button class="c-btn" onclick="calcAppend('Math.cos(')">cos</button>

          <!-- Row 5 -->
          <button class="c-btn" onclick="calcAppend('tan(')">tan</button>
          <button class="c-btn" onclick="calcAppend('RCL')">RCL</button>
          <button class="c-btn" onclick="calcAppend('(')">(</button>
          <button class="c-btn" onclick="calcAppend(')')">)</button>
          <button class="c-btn" onclick="calcAppend('S')">S⇔D</button>

          <!-- Row 6: Number Matrix & Ops -->
          <button class="c-btn" onclick="calcAppend('7')">7</button>
          <button class="c-btn" onclick="calcAppend('8')">8</button>
          <button class="c-btn" onclick="calcAppend('9')">9</button>
          <button class="c-btn c-btn-del" onclick="calcBackspace()">DEL</button>
          <button class="c-btn c-btn-ac" onclick="calcClear()">AC</button>

          <!-- Row 7 -->
          <button class="c-btn" onclick="calcAppend('4')">4</button>
          <button class="c-btn" onclick="calcAppend('5')">5</button>
          <button class="c-btn" onclick="calcAppend('6')">6</button>
          <button class="c-btn c-btn-op" onclick="calcAppend('*')">×</button>
          <button class="c-btn c-btn-op" onclick="calcAppend('/')">÷</button>

          <!-- Row 8 -->
          <button class="c-btn" onclick="calcAppend('1')">1</button>
          <button class="c-btn" onclick="calcAppend('2')">2</button>
          <button class="c-btn" onclick="calcAppend('3')">3</button>
          <button class="c-btn c-btn-op" onclick="calcAppend('+')">+</button>
          <button class="c-btn c-btn-op" onclick="calcAppend('-')">-</button>

          <!-- Row 9 -->
          <button class="c-btn" onclick="calcAppend('0')">0</button>
          <button class="c-btn" onclick="calcAppend('.')">.</button>
          <button class="c-btn" onclick="calcAppend('Math.PI')">π</button>
          <button class="c-btn" onclick="calcEval()">Ans</button>
          <button class="c-btn c-btn-equals" onclick="calcEval()">=</button>
        </div>
      </div>
    `;
    return html;
  }

  let calcExpr = "";
  window.calcAppend = (val) => { 
    calcExpr += val; 
    document.getElementById('calc-display').value = calcExpr; 
  }
  window.calcClear = () => { 
    calcExpr = ""; 
    document.getElementById('calc-display').value = "0"; 
  }
  window.calcBackspace = () => {
    calcExpr = calcExpr.slice(0, -1);
    document.getElementById('calc-display').value = calcExpr || "0";
  }
  window.calcEval = () => { 
    try { 
      let evaluated = eval(calcExpr);
      calcExpr = evaluated.toString(); 
      document.getElementById('calc-display').value = calcExpr; 
    } catch(e) { 
      document.getElementById('calc-display').value = "Error"; 
      calcExpr = ""; 
    } 
  }

  function buildSettings() {
    let html = `<header><div></div><h1>Settings</h1><div></div></header>`;
    html += `
      <div class="card">
        <h3>Data Management</h3>
        <p style="color:var(--text-muted); font-size:0.9rem;">Your study data is saved locally on this device.</p>
        <button class="btn btn-danger" onclick="clearAllData()">Reset All Data</button>
      </div>
    `;
    return html;
  }

  window.clearAllData = () => {
    if (confirm("Are you sure? This will delete all topics and quizzes.")) {
      localStorage.removeItem('study_app_data_v3');
      db = { topics: [] };
      render();
    }
  }

  render();
</script>
</body>
</html>
