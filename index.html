<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Offline Study App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0d12">
<style>
  :root {
    --bg-color: #0b0d12;
    --card-color: #131720;
    --text-main: #f2f4f8;
    --text-muted: #9aa4b5;
    --accent: #8b7cff;
    --thick-outline: #242936;
    --danger: #ff6577;
    --green: #4fd18b;
  }
  
  * { box-sizing: border-box; font-family: sans-serif; }
  
  body {
    margin: 0; padding: 0 0 80px 0;
    background-color: var(--bg-color); color: var(--text-main);
  }

  .card {
    background: var(--card-color); border: 3px solid var(--thick-outline);
    border-radius: 12px; padding: 16px; margin: 12px 16px;
    box-shadow: 4px 4px 0px var(--thick-outline); position: relative;
  }

  .btn {
    display: block; width: 100%; background: var(--card-color); color: var(--text-main);
    border: 3px solid var(--thick-outline); border-radius: 10px; padding: 10px;
    font-weight: bold; font-size: 0.95rem; cursor: pointer; transition: 0.1s;
    box-shadow: 3px 3px 0px var(--thick-outline); text-align: center;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px transparent; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 3px 3px 0px #5a4bcf; }
  .btn-danger { background: var(--card-color); color: var(--danger); border-color: var(--danger); box-shadow: 3px 3px 0px #b33949; }
  .btn-success { background: var(--card-color); color: var(--green); border-color: var(--green); box-shadow: 3px 3px 0px #2f855a; }

  header {
    padding: 18px 16px; border-bottom: 3px solid var(--thick-outline);
    background: var(--bg-color); display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }

  input, textarea {
    width: 100%; background: var(--bg-color); color: var(--text-main);
    border: 3px solid var(--thick-outline); border-radius: 8px;
    padding: 12px; font-size: 1rem; outline: none; margin-bottom: 12px; resize: vertical;
  }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card-color);
    border-top: 3px solid var(--thick-outline); padding-bottom: env(safe-area-inset-bottom); z-index: 50;
  }
  .nav-btn {
    flex: 1; padding: 14px 4px; background: transparent; border: none; border-right: 3px solid var(--thick-outline);
    color: var(--text-muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 0.75rem; font-weight: bold; text-transform: uppercase;
  }
  .nav-btn:last-child { border-right: none; }
  .nav-btn.active { color: var(--accent); background: rgba(139, 124, 255, 0.1); }
  .nav-icon { font-size: 1.4rem; }

  .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .title-row h3 { margin: 0; }
  .back-btn { background: none; border: none; color: var(--accent); font-weight: bold; font-size: 1rem; cursor: pointer; padding: 0; }

  /* FlipaClip Style Scratchpad UI */
  .scratch-toolbar {
    display: flex; gap: 8px; padding: 8px 16px; background: var(--card-color);
    border-bottom: 3px solid var(--thick-outline); align-items: center; overflow-x: auto;
  }
  .tool-btn {
    background: var(--bg-color); border: 2px solid var(--thick-outline); color: var(--text-main);
    padding: 6px 12px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; cursor: pointer;
    box-shadow: 2px 2px 0px var(--thick-outline); white-space: nowrap; flex-shrink: 0;
  }
  .tool-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  
  .canvas-wrapper {
    position: relative; width: 100%; height: 60vh; background: #ffffff;
    border-bottom: 3px solid var(--thick-outline); overflow: hidden; touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

  .canvas-controls {
    display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--card-color);
    border-bottom: 3px solid var(--thick-outline);
  }
  .slider-group { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: bold; color: var(--text-muted); width: 60%; }
  .slider-group input { flex: 1; margin: 0; accent-color: var(--accent); }

  /* Topic & Quiz Styles */
  .quiz-option {
    background: var(--bg-color); border: 2px solid var(--thick-outline);
    padding: 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer;
    font-weight: bold; box-shadow: 2px 2px 0px var(--thick-outline);
  }
  .quiz-option.selected { border-color: var(--accent); background: rgba(139, 124, 255, 0.15); }
  .quiz-option.correct { border-color: var(--green); background: rgba(79, 209, 139, 0.2); color: var(--green); }
  .quiz-option.incorrect { border-color: var(--danger); background: rgba(255, 101, 119, 0.2); color: var(--danger); }

  .menu-container { position: relative; display: inline-block; }
  .dots-btn { background: none; border: none; color: var(--text-main); font-size: 1.4rem; font-weight: bold; cursor: pointer; padding: 0 6px; }
  .dropdown-menu {
    position: absolute; right: 0; top: 30px; background: var(--card-color);
    border: 3px solid var(--thick-outline); border-radius: 8px; z-index: 20;
    box-shadow: 3px 3px 0px var(--thick-outline); display: none; min-width: 110px;
  }
  .dropdown-menu.show { display: block; }
  .dropdown-item {
    padding: 10px 14px; font-size: 0.9rem; font-weight: bold; cursor: pointer;
    border-bottom: 2px solid var(--thick-outline); text-align: left; background: none; color: var(--text-main); width: 100%;
  }
  .dropdown-item:last-child { border-bottom: none; }
  #import-file { display: none; }
</style>
</head>
<body>

<div id="app"></div>

<div class="bottom-nav">
  <button class="nav-btn" id="nav-scratch" onclick="setTab('scratchpad')">
    <span class="nav-icon">✏️</span><span>Draw</span>
  </button>
  <button class="nav-btn active" id="nav-sub" onclick="setTab('subjects')">
    <span class="nav-icon">📓</span><span>Topics</span>
  </button>
  <button class="nav-btn" id="nav-set" onclick="setTab('settings')">
    <span class="nav-icon">⚙️</span><span>Settings</span>
  </button>
</div>
<script>
  let currentTab = 'subjects';
  let viewStack = ['topicList'];
  let activeTopicId = null;
  let openMenuTopicId = null;
  let bulkPasteText = '';
  
  let quizIndex = 0;
  let quizSelectedOpt = null;
  let quizScore = 0;
  let quizAnswered = false;

  let scratchSavedData = null;
  let undoStack = [];
  let redoStack = [];
  let currentTool = 'pen';
  let brushSize = 4;
  let isDrawing = false;
  let canvas, ctx;
  let scale = 1, panX = 0, panY = 0;
  let startX = 0, startY = 0;
  let initialPinchDist = null;

  let db = JSON.parse(localStorage.getItem('study_app_data_v4')) || { topics: [] };

  function saveData() {
    localStorage.setItem('study_app_data_v4', JSON.stringify(db));
  }

  function setTab(tab) {
    if (currentTab === 'scratchpad' && canvas) {
      scratchSavedData = canvas.toDataURL();
    }
    currentTab = tab;
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    if(tab === 'scratchpad') document.getElementById('nav-scratch').classList.add('active');
    if(tab === 'subjects') {
      document.getElementById('nav-sub').classList.add('active');
      viewStack = ['topicList'];
    }
    if(tab === 'settings') document.getElementById('nav-set').classList.add('active');
    render();
  }

  function goBack() {
    if (viewStack.length > 1) {
      viewStack.pop();
      render();
    }
  }

  function addTopic() {
    const name = prompt('Enter new topic name:');
    if (name && name.trim() !== '') {
      const newTopic = { id: Date.now().toString(), name: name.trim(), quiz: [] };
      db.topics.push(newTopic);
      activeTopicId = newTopic.id;
      viewStack.push('topicDetail');
      saveData();
      render();
    }
  }

  function toggleMenu(topicId, event) {
    event.stopPropagation();
    openMenuTopicId = (openMenuTopicId === topicId) ? null : topicId;
    render();
  }

  function editTopic(topicId, event) {
    event.stopPropagation();
    openMenuTopicId = null;
    activeTopicId = topicId;
    viewStack.push('topicDetail');
    render();
  }

  function deleteTopic(topicId, event) {
    event.stopPropagation();
    openMenuTopicId = null;
    if (confirm('Delete this topic?')) {
      db.topics = db.topics.filter(t => t.id !== topicId);
      saveData();
      render();
    }
  }

  function handleTopicClick(topicId) {
    const topic = db.topics.find(t => t.id === topicId);
    activeTopicId = topicId;
    if (topic.quiz.length === 0) {
      viewStack.push('topicDetail');
    } else {
      quizIndex = 0;
      quizScore = 0;
      quizSelectedOpt = null;
      quizAnswered = false;
      viewStack.push('takeQuiz');
    }
    render();
  }

  function parseAndImportQuestions(topicId) {
    const lines = bulkPasteText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length);
    const qRe = /^(\d{1,3})[\.\)]\s*(.+)/;
    const optRe = /^([A-Da-d])[\.\)]\s*(.+)/;
    const markers = ['✅','✔️','✔','✓'];
    let parsedQuestions = [], current = null;

    function finalize(c){
      if(!c || !c.question || c.options.length < 2) return null;
      let correctIndex = c.options.findIndex(o => o.isCorrect);
      if(correctIndex === -1) correctIndex = 0;
      return { question: c.question, options: c.options.map(o => o.text), correctIndex };
    }

    for(const line of lines){
      const optMatch = line.match(optRe);
      const qMatch = !optMatch ? line.match(qRe) : null;
      if(qMatch){
        const done = finalize(current);
        if(done) parsedQuestions.push(done);
        current = { question: qMatch[2].trim(), options: [] };
        continue;
      }
      if(optMatch && current){
        let text = optMatch[2].trim();
        let isCorrect = false;
        for(const m of markers){
          if(text.includes(m)){ isCorrect = true; text = text.split(m)[0].trim(); }
        }
        if(/\(correct\)/i.test(text)){ isCorrect = true; text = text.replace(/\(correct\)/i,'').trim(); }
        if(text) current.options.push({ text, isCorrect });
      }
    }
    const done = finalize(current);
    if(done) parsedQuestions.push(done);

    if(parsedQuestions.length === 0) {
      alert('Could not parse questions. Ensure they are numbered (1.) with options (A.) and a symbol like ✅ on the correct answer.');
      return;
    }

    const topic = db.topics.find(t => t.id === topicId);
    topic.quiz.push(...parsedQuestions);
    bulkPasteText = '';
    saveData();
    alert(`Imported ${parsedQuestions.length} question(s)!`);
    render();
  }

  function deleteQuestion(index) {
    const topic = db.topics.find(t => t.id === activeTopicId);
    topic.quiz.splice(index, 1);
    saveData();
    render();
  }

  function startQuizSession() {
    const topic = db.topics.find(t => t.id === activeTopicId);
    if (topic.quiz.length === 0) {
      alert('Add at least one question before taking the quiz!');
      return;
    }
    quizIndex = 0; quizScore = 0; quizSelectedOpt = null; quizAnswered = false;
    viewStack.push('takeQuiz');
    render();
  }

  function render() {
    const app = document.getElementById('app');
    app.innerHTML = '';

    if (currentTab === 'scratchpad') {
      app.innerHTML = buildScratchpad();
      initCanvas();
    } else if (currentTab === 'settings') {
      app.innerHTML = buildSettings();
    } else if (currentTab === 'subjects') {
      const currentView = viewStack[viewStack.length - 1];
      if (currentView === 'topicList') app.innerHTML += buildTopicList();
      if (currentView === 'topicDetail') app.innerHTML += buildTopicDetail();
      if (currentView === 'takeQuiz') app.innerHTML += buildQuizSession();
    }
  }

  function buildTopicList() {
    let html = `<header><div></div><h1>My Topics</h1><div></div></header><div style="padding: 0 4px;">`;
    if (db.topics.length === 0) {
      html += `<div class="card"><p style="text-align:center; color:var(--text-muted);">No topics yet. Tap below to create one!</p></div>`;
    } else {
      db.topics.forEach(top => {
        const isMenuOpen = openMenuTopicId === top.id;
        html += `
          <div class="card" onclick="handleTopicClick('${top.id}')" style="cursor:pointer;">
            <div class="title-row">
              <h3>${top.name}</h3>
              <div class="menu-container">
                <button class="dots-btn" onclick="toggleMenu('${top.id}', event)">⋮</button>
                <div class="dropdown-menu ${isMenuOpen ? 'show' : ''}">
                  <button class="dropdown-item" onclick="editTopic('${top.id}', event)">Edit</button>
                  <button class="dropdown-item" style="color:var(--danger);" onclick="deleteTopic('${top.id}', event)">Delete</button>
                </div>
              </div>
            </div>
            <div style="font-size:0.85rem; color:var(--text-muted);">${top.quiz.length} Quiz Questions</div>
          </div>
        `;
      });
    }
    html += `<div style="padding: 0 16px; margin-top: 16px;"><button class="btn btn-primary" onclick="addTopic()">+ Add Topic</button></div></div>`;
    return html;
  }

  function buildTopicDetail() {
    const topic = db.topics.find(t => t.id === activeTopicId);
    let html = `
      <div style="padding: 0 4px;">
        <div style="margin: 16px 16px 8px 16px; display:flex; justify-content:space-between; align-items:center;">
          <button class="back-btn" onclick="goBack()">◀ BACK TO TOPICS</button>
          <span style="font-size:0.85rem; color:var(--text-muted);">${topic.name}</span>
        </div>
      </div>
    `;
    if (topic.quiz.length > 0) {
      html += `
        <div class="card" style="background:var(--accent); border-color:#5a4bcf; color:#fff;">
          <h3 style="margin-bottom:6px;">Ready to Practice?</h3>
          <p style="margin:0 0 12px 0; font-size:0.9rem; opacity:0.9;">Take the interactive quiz for this topic (${topic.quiz.length} questions available).</p>
          <button class="btn" style="background:#fff; color:var(--accent); border-color:#fff;" onclick="startQuizSession()">🚀 Take Quiz Now</button>
        </div>
      `;
    }
    html += `
      <div class="card">
        <h3>Paste AI Quiz Questions</h3>
        <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:10px;">Paste questions formatted with numbered queries and options A–D. Mark the correct answer with ✅ or ✓.</p>
        <textarea rows="6" placeholder="1. What is 2 + 2?\nA. 3\nB. 4 ✅\nC. 5\nD. 6" oninput="bulkPasteText=this.value">${bulkPasteText}</textarea>
        <button class="btn btn-success" onclick="parseAndImportQuestions('${topic.id}')">Import Pasted Questions</button>
      </div>
    `;
    html += `<div class="card"><h3>Manage Quiz Questions (${topic.quiz.length})</h3>`;
    if (topic.quiz.length > 0) {
      topic.quiz.forEach((q, idx) => {
        html += `
          <div style="background:var(--bg-color); border:2px solid var(--thick-outline); padding:10px; border-radius:8px; margin-bottom:10px;">
            <div style="display:flex; justify-content:space-between; align-items:start;">
              <strong>Q${idx + 1}: ${q.question}</strong>
              <button class="btn btn-danger" style="width:auto; padding:4px 8px; margin:0; font-size:0.8rem;" onclick="deleteQuestion(${idx})">X</button>
            </div>
            <ul style="margin:6px 0 0 16px; padding:0; font-size:0.9rem; color:var(--text-muted);">
              ${q.options.map((opt, oIdx) => `<li style="color:${oIdx === q.correctIndex ? 'var(--green)' : 'inherit'};">${opt} ${oIdx === q.correctIndex ? '(Correct)' : ''}</li>`).join('')}
            </ul>
          </div>
        `;
      });
    } else {
      html += `<p style="color:var(--text-muted); font-size:0.9rem;">No questions added yet. Paste some above!</p>`;
    }
    html += `</div>`;
    return html;
  }

  function buildQuizSession() {
    const topic = db.topics.find(t => t.id === activeTopicId);
    if (quizIndex >= topic.quiz.length) {
      const percentage = Math.round((quizScore / topic.quiz.length) * 100);
      return `
        <div style="padding: 0 4px;">
          <div style="margin: 16px 16px 8px 16px;"><button class="back-btn" onclick="goBack()">◀ BACK TO TOPIC</button></div>
          <div class="card" style="text-align:center;">
            <h2>Quiz Complete! 🎉</h2>
            <p style="font-size: 1.5rem; font-weight:bold; color:var(--accent); margin: 20px 0;">Score: ${quizScore} / ${topic.quiz.length} (${percentage}%)</p>
            <button class="btn btn-primary" onclick="startQuizSession()">Retake Quiz</button>
            <button class="btn" style="margin-top:10px;" onclick="goBack()">Back to Topic</button>
          </div>
        </div>
      `;
    }
    const q = topic.quiz[quizIndex];
    let html = `
      <div style="padding: 0 4px;">
        <div style="margin: 16px 16px 8px 16px; display:flex; justify-content:space-between; align-items:center;">
          <button class="back-btn" onclick="goBack()">◀ QUIT QUIZ</button>
          <span style="font-size:0.85rem; color:var(--text-muted);">Question ${quizIndex + 1} of ${topic.quiz.length}</span>
        </div>
        <div class="card">
          <h3 style="margin-bottom:16px; font-size:1.1rem; line-height:1.4;">${q.question}</h3>
    `;
    q.options.forEach((opt, idx) => {
      let optClass = 'quiz-option';
      if (quizAnswered) {
        if (idx === q.correctIndex) optClass += ' correct';
        else if (idx === quizSelectedOpt) optClass += ' incorrect';
      } else if (quizSelectedOpt === idx) {
        optClass += ' selected';
      }
      html += `<div class="${optClass}" onclick="${quizAnswered ? '' : `quizSelectedOpt=${idx}; render();`}">${String.fromCharCode(65 + idx)}. ${opt}</div>`;
    });
    if (!quizAnswered) {
      html += `<button class="btn btn-primary" style="margin-top:16px;" ${quizSelectedOpt === null ? 'disabled style="opacity:0.5;"' : ''} onclick="submitQuizAnswer()">Submit Answer</button>`;
    } else {
      html += `<button class="btn btn-primary" style="margin-top:16px;" onclick="nextQuizQuestion()">Next Question ➔</button>`;
    }
    html += `</div></div>`;
    return html;
  }

  function submitQuizAnswer() {
    if (quizSelectedOpt === null) return;
    const topic = db.topics.find(t => t.id === activeTopicId);
    if (quizSelectedOpt === topic.quiz[quizIndex].correctIndex) quizScore++;
    quizAnswered = true;
    render();
  }

  function nextQuizQuestion() {
    quizIndex++; quizSelectedOpt = null; quizAnswered = false;
    render();
  }
</script>
<script>
  function buildScratchpad() {
    return `
      <header><div></div><h1>Scratchpad</h1><div></div></header>
      <div class="scratch-toolbar">
        <button class="tool-btn ${currentTool==='pen'?'active':''}" onclick="setTool('pen')">✏️ Pen</button>
        <button class="tool-btn ${currentTool==='eraser'?'active':''}" onclick="setTool('eraser')">🧹 Eraser</button>
        <button class="tool-btn ${currentTool==='select'?'active':''}" onclick="setTool('select')">✂️ Select</button>
        <button class="tool-btn" onclick="undo()" title="Undo">↩️</button>
        <button class="tool-btn" onclick="redo()" title="Redo">↪️</button>
        <button class="tool-btn" onclick="clearCanvas()" style="color:var(--danger)">Clear</button>
      </div>
      <div class="canvas-controls">
        <div class="slider-group">
          <span>Size:</span>
          <input type="range" min="1" max="30" value="${brushSize}" oninput="updateBrushSize(this.value)">
        </div>
        <span style="font-size:0.75rem; color:var(--text-muted)">Pinch to Zoom 🔍</span>
      </div>
      <div class="canvas-wrapper" id="canvas-wrap">
        <canvas id="scratch-canvas"></canvas>
      </div>
    `;
  }

  function initCanvas() {
    canvas = document.getElementById('scratch-canvas');
    if(!canvas) return;
    ctx = canvas.getContext('2d');
    
    canvas.width = canvas.parentElement.clientWidth * 2;
    canvas.height = canvas.parentElement.clientHeight * 2;
    ctx.scale(2, 2);

    if (scratchSavedData) {
      let img = new Image();
      img.onload = function() {
        ctx.drawImage(img, 0, 0, canvas.width/2, canvas.height/2);
        saveState();
      };
      img.src = scratchSavedData;
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      saveState();
    }

    canvas.addEventListener('pointerdown', handlePointerDown);
    canvas.addEventListener('pointermove', handlePointerMove);
    canvas.addEventListener('pointerup', handlePointerUp);
    canvas.addEventListener('pointercancel', handlePointerUp);

    const wrapper = document.getElementById('canvas-wrap');
    wrapper.addEventListener('touchstart', handleTouchStart, {passive: false});
    wrapper.addEventListener('touchmove', handleTouchMove, {passive: false});
  }

  function setTool(tool) {
    currentTool = tool;
    render();
  }

  function updateBrushSize(val) {
    brushSize = parseInt(val);
  }

  function saveState() {
    if(!canvas) return;
    if (undoStack.length > 20) undoStack.shift();
    undoStack.push(canvas.toDataURL());
    redoStack = [];
  }

  function undo() {
    if (undoStack.length > 1) {
      redoStack.push(undoStack.pop());
      let imgData = undoStack[undoStack.length - 1];
      let img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width/2, canvas.height/2);
      };
      img.src = imgData;
    }
  }

  function redo() {
    if (redoStack.length > 0) {
      let imgData = redoStack.pop();
      undoStack.push(imgData);
      let img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width/2, canvas.height/2);
      };
      img.src = imgData;
    }
  }

  function clearCanvas() {
    if(confirm("Clear entire canvas?")) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      saveState();
    }
  }

  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left - panX) / scale,
      y: (e.clientY - rect.top - panY) / scale
    };
  }

  function handlePointerDown(e) {
    if (e.pointerType === 'touch' && e.isPrimary === false) return;
    isDrawing = true;
    const pos = getCanvasPos(e);
    startX = pos.x; startY = pos.y;

    if (currentTool === 'pen') {
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = brushSize;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.globalCompositeOperation = 'source-over';
    } else if (currentTool === 'eraser') {
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = brushSize * 3;
      ctx.lineCap = 'round';
      ctx.globalCompositeOperation = 'source-over';
    } else if (currentTool === 'select') {
      isSelecting = true;
    }
  }

  function handlePointerMove(e) {
    if (!isDrawing) return;
    const pos = getCanvasPos(e);
    if (currentTool === 'pen' || currentTool === 'eraser') {
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }
  }

  function handlePointerUp(e) {
    if (!isDrawing) return;
    isDrawing = false;
    if (currentTool === 'pen' || currentTool === 'eraser') {
      saveState();
    }
    if (currentTool === 'select' && isSelecting) {
      isSelecting = false;
      alert("Selection mode: Dragged selection cleared area.");
    }
  }

  function handleTouchStart(e) {
    if (e.touches.length === 2) {
      initialPinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }

  function handleTouchMove(e) {
    if (e.touches.length === 2 && initialPinchDist) {
      e.preventDefault();
      let currentDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      let factor = currentDist / initialPinchDist;
      scale = Math.min(Math.max(0.5, scale * factor), 4);
      initialPinchDist = currentDist;
      updateCanvasTransform();
    }
  }

  function updateCanvasTransform() {
    canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  }

  function buildSettings() {
    let html = `<header><div></div><h1>Settings</h1><div></div></header>`;
    html += `
      <div class="card">
        <h3>Backup Data</h3>
        <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom: 12px;">Export your topics and quizzes to a file so you never lose them. You can import them back later.</p>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-success" style="margin-top:0;" onclick="exportData()">Export</button>
          <button class="btn btn-primary" style="margin-top:0;" onclick="document.getElementById('import-file').click()">Import</button>
        </div>
        <input type="file" id="import-file" accept=".json" onchange="importData(event)">
      </div>
      <div class="card">
        <h3>Danger Zone</h3>
        <p style="color:var(--text-muted); font-size:0.85rem;">This will permanently wipe all local data.</p>
        <button class="btn btn-danger" onclick="clearAllData()">Reset All Data</button>
      </div>
    `;
    return html;
  }

  window.exportData = () => {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
    const dlAnchorElem = document.createElement('a');
    dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", "study_app_backup.json");
    dlAnchorElem.click();
  }

  window.importData = (event) => {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const importedData = JSON.parse(e.target.result);
        if (importedData && importedData.topics) {
          db = importedData;
          saveData();
          alert('Data successfully imported!');
          render();
        } else {
          alert('Invalid backup file format.');
        }
      } catch (err) {
        alert('Error reading the file.');
      }
    };
    reader.readAsText(file);
  }

  window.clearAllData = () => {
    if (confirm("Are you sure? This will delete all topics and quizzes. Did you export a backup?")) {
      localStorage.removeItem('study_app_data_v4');
      db = { topics: [] };
      render();
    }
  }

  render();
</script>
</body>
</html>
