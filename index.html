<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline Study App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0d12">
<style>
  :root {
    --bg-color: #0b0d12;
    --card-color: #131720;
    --text-main: #f2f4f8;
    --text-muted: #9aa4b5;
    --accent: #8b7cff;
    --accent-hover: #6f61ed;
    --thick-outline: #242936;
    --danger: #ff6577;
    --green: #4fd18b;
  }
  
  * { box-sizing: border-box; font-family: sans-serif; }
  
  body {
    margin: 0; padding: 0 0 80px 0;
    background-color: var(--bg-color); color: var(--text-main);
  }

  .card {
    background: var(--card-color);
    border: 3px solid var(--thick-outline);
    border-radius: 12px;
    padding: 16px;
    margin: 12px 16px;
    box-shadow: 4px 4px 0px var(--thick-outline);
  }

  .btn {
    display: block; width: 100%;
    background: var(--card-color); color: var(--text-main);
    border: 3px solid var(--thick-outline);
    border-radius: 10px; padding: 12px;
    font-weight: bold; font-size: 1rem;
    cursor: pointer; transition: 0.1s;
    box-shadow: 3px 3px 0px var(--thick-outline);
    margin-top: 10px;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0px 0px 0px transparent; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 3px 3px 0px #5a4bcf; }
  .btn-danger { background: var(--card-color); color: var(--danger); border-color: var(--danger); box-shadow: 3px 3px 0px #b33949; }
  .btn-success { background: var(--card-color); color: var(--green); border-color: var(--green); box-shadow: 3px 3px 0px #2f855a; }

  header {
    padding: 18px 16px;
    border-bottom: 3px solid var(--thick-outline);
    background: var(--bg-color);
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }

  .subject-bar {
    display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px;
    background: var(--card-color); border-bottom: 3px solid var(--thick-outline);
    white-space: nowrap; align-items: center; scrollbar-width: none;
  }
  .subject-bar::-webkit-scrollbar { display: none; }
  
  .subject-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--bg-color); border: 2px solid var(--thick-outline);
    padding: 8px 14px; border-radius: 20px; font-weight: bold;
    cursor: pointer; color: var(--text-main); flex-shrink: 0;
    box-shadow: 2px 2px 0px var(--thick-outline);
  }
  .subject-chip.active {
    background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 2px 2px 0px #5a4bcf;
  }
  .chip-add {
    background: var(--green); color: #0b0d12; border: 2px solid var(--thick-outline);
    padding: 8px 14px; border-radius: 20px; font-weight: bold;
    cursor: pointer; flex-shrink: 0; box-shadow: 2px 2px 0px var(--thick-outline);
  }
  .chip-del {
    background: none; border: none; color: inherit; cursor: pointer;
    font-size: 0.9rem; padding: 0; font-weight: bold; margin-left: 4px;
  }

  input, textarea {
    width: 100%; background: var(--bg-color); color: var(--text-main);
    border: 3px solid var(--thick-outline); border-radius: 8px;
    padding: 12px; font-size: 1rem; outline: none;
    margin-bottom: 12px; resize: vertical;
  }
  input:focus, textarea:focus { border-color: var(--accent); }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; background: var(--card-color);
    border-top: 3px solid var(--thick-outline);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 50;
  }
  .nav-btn {
    flex: 1; padding: 14px 4px;
    background: transparent; border: none; border-right: 3px solid var(--thick-outline);
    color: var(--text-muted); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 0.75rem; font-weight: bold; text-transform: uppercase;
  }
  .nav-btn:last-child { border-right: none; }
  .nav-btn.active { color: var(--accent); background: rgba(139, 124, 255, 0.1); }
  .nav-icon { font-size: 1.4rem; }

  .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .title-row h3 { margin: 0; }
  .back-btn { background: none; border: none; color: var(--accent); font-weight: bold; font-size: 1rem; cursor: pointer; padding: 0; }
  
  .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .calc-btn { padding: 15px 0; font-size: 1.2rem; border-radius: 8px; }
  
  .option-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .option-row input { margin-bottom: 0; }

  .quiz-option {
    background: var(--bg-color); border: 2px solid var(--thick-outline);
    padding: 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer;
    font-weight: bold; box-shadow: 2px 2px 0px var(--thick-outline);
  }
  .quiz-option.selected { border-color: var(--accent); background: rgba(139, 124, 255, 0.15); }
  .quiz-option.correct { border-color: var(--green); background: rgba(79, 209, 139, 0.2); color: var(--green); }
  .quiz-option.incorrect { border-color: var(--danger); background: rgba(255, 101, 119, 0.2); color: var(--danger); }
</style>
</head>
<body>

<div id="app"></div>

<div class="bottom-nav">
  <button class="nav-btn" id="nav-calc" onclick="setTab('calculator')">
    <span class="nav-icon">🖩</span><span>Calc</span>
  </button>
  <button class="nav-btn active" id="nav-sub" onclick="setTab('subjects')">
    <span class="nav-icon">📓</span><span>Subjects</span>
  </button>
  <button class="nav-btn" id="nav-set" onclick="setTab('settings')">
    <span class="nav-icon">⚙️</span><span>Settings</span>
  </button>
</div>
<script>
  let currentTab = 'subjects';
  let viewStack = ['topicList'];
  let activeSubjectId = null;
  let activeTopicId = null;
  
  let draftQuestion = { question: '', options: ['', '', '', ''], correctIndex: 0 };
  
  let quizIndex = 0;
  let quizSelectedOpt = null;
  let quizScore = 0;
  let quizAnswered = false;

  let db = JSON.parse(localStorage.getItem('study_app_data')) || { subjects: [] };

  if (db.subjects.length > 0 && !activeSubjectId) {
    activeSubjectId = db.subjects[0].id;
  }

  function saveData() {
    localStorage.setItem('study_app_data', JSON.stringify(db));
  }

  function setTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    if(tab === 'calculator') document.getElementById('nav-calc').classList.add('active');
    if(tab === 'subjects') {
      document.getElementById('nav-sub').classList.add('active');
      viewStack = ['topicList'];
    }
    if(tab === 'settings') document.getElementById('nav-set').classList.add('active');
    render();
  }

  function goBack() {
    if (viewStack.length > 1) {
      viewStack.pop();
      render();
    }
  }

  function addSubject() {
    const name = prompt('Enter new subject name:');
    if (name && name.trim() !== '') {
      const newSub = { id: Date.now().toString(), name: name.trim(), topics: [] };
      db.subjects.push(newSub);
      activeSubjectId = newSub.id;
      viewStack = ['topicList'];
      saveData();
      render();
    }
  }

  function deleteSubject(id, event) {
    event.stopPropagation();
    if (confirm('Delete this subject and all its topics?')) {
      db.subjects = db.subjects.filter(s => s.id !== id);
      if (db.subjects.length > 0) {
        activeSubjectId = db.subjects[0].id;
      } else {
        activeSubjectId = null;
      }
      viewStack = ['topicList'];
      saveData();
      render();
    }
  }

  function addTopic() {
    const name = prompt('Enter new topic name:');
    if (name && name.trim() !== '') {
      const subject = db.subjects.find(s => s.id === activeSubjectId);
      if (subject) {
        subject.topics.push({ id: Date.now().toString(), name: name.trim(), content: '', quiz: [] });
        saveData();
        render();
      }
    }
  }

  function deleteTopic(topicId, event) {
    event.stopPropagation();
    if (confirm('Delete this topic?')) {
      const subject = db.subjects.find(s => s.id === activeSubjectId);
      if (subject) {
        subject.topics = subject.topics.filter(t => t.id !== topicId);
        saveData();
        render();
      }
    }
  }

  function saveNotes(topicId) {
    const textarea = document.getElementById('topic-notes');
    const subject = db.subjects.find(s => s.id === activeSubjectId);
    const topic = subject.topics.find(t => t.id === topicId);
    topic.content = textarea.value;
    saveData();
    alert('Notes saved!');
  }

  function addQuestionToTopic() {
    if (!draftQuestion.question.trim() || draftQuestion.options.some(o => !o.trim())) {
      alert('Please fill out the question and all 4 options.');
      return;
    }
    const subject = db.subjects.find(s => s.id === activeSubjectId);
    const topic = subject.topics.find(t => t.id === activeTopicId);
    
    topic.quiz.push({ ...draftQuestion });
    saveData();
    
    draftQuestion = { question: '', options: ['', '', '', ''], correctIndex: 0 };
    render();
  }

  function deleteQuestion(index) {
    const subject = db.subjects.find(s => s.id === activeSubjectId);
    const topic = subject.topics.find(t => t.id === activeTopicId);
    topic.quiz.splice(index, 1);
    saveData();
    render();
  }

  function startQuizSession() {
    const subject = db.subjects.find(s => s.id === activeSubjectId);
    const topic = subject.topics.find(t => t.id === activeTopicId);
    if (topic.quiz.length === 0) {
      alert('Add at least one question before taking the quiz!');
      return;
    }
    quizIndex = 0;
    quizScore = 0;
    quizSelectedOpt = null;
    quizAnswered = false;
    viewStack.push('takeQuiz');
    render();
  }

  function render() {
    const app = document.getElementById('app');
    app.innerHTML = '';

    if (currentTab === 'calculator') {
      app.innerHTML = buildCalculator();
    } else if (currentTab === 'settings') {
      app.innerHTML = buildSettings();
    } else if (currentTab === 'subjects') {
      app.innerHTML = buildSubjectScroller();
      const currentView = viewStack[viewStack.length - 1];
      if (currentView === 'topicList') app.innerHTML += buildTopicList();
      if (currentView === 'topicDetail') app.innerHTML += buildTopicDetail();
      if (currentView === 'takeQuiz') app.innerHTML += buildQuizSession();
    }
  }

  function buildSubjectScroller() {
    let html = `<div class="subject-bar">`;
    db.subjects.forEach(sub => {
      const isActive = sub.id === activeSubjectId ? 'active' : '';
      html += `
        <div class="subject-chip ${isActive}" onclick="activeSubjectId='${sub.id}'; viewStack=['topicList']; render();">
          ${sub.name}
          <button class="chip-del" onclick="deleteSubject('${sub.id}', event)">×</button>
        </div>
      `;
    });
    html += `<button class="chip-add" onclick="addSubject()">+ Sub</button></div>`;
    return html;
  }

  function buildTopicList() {
    if (db.subjects.length === 0) {
      return `<div class="card"><p style="text-align:center; color:var(--text-muted);">No subjects yet. Tap "+ Sub" above to create one!</p></div>`;
    }

    const subject = db.subjects.find(s => s.id === activeSubjectId);
    if (!subject) return `<div class="card"><p style="text-align:center; color:var(--text-muted);">Select a subject above.</p></div>`;

    let html = `<div style="padding: 0 4px;"><h2 style="margin: 16px 16px 8px 16px; font-size:1.1rem; color:var(--accent);">${subject.name} Topics</h2>`;
    
    if (subject.topics.length === 0) {
      html += `<div class="card"><p style="text-align:center; color:var(--text-muted);">No topics in this subject yet.</p></div>`;
    } else {
      subject.topics.forEach(top => {
        html += `
          <div class="card" onclick="activeTopicId='${top.id}'; viewStack.push('topicDetail'); render();" style="cursor:pointer;">
            <div class="title-row">
              <h3>${top.name}</h3>
              <div style="display:flex; align-items:center; gap:10px;">
                <button class="btn btn-danger" style="width:auto; padding:4px 8px; margin:0; font-size:0.8rem;" onclick="deleteTopic('${top.id}', event)">Delete</button>
                <span style="color:var(--text-muted)">▶</span>
              </div>
            </div>
            <div style="font-size:0.85rem; color:var(--text-muted);">${top.quiz.length} Quiz Questions</div>
          </div>
        `;
      });
    }
    html += `<div style="padding: 0 16px;"><button class="btn btn-primary" onclick="addTopic()">+ Add Topic</button></div></div>`;
    return html;
  }

  function buildTopicDetail() {
    const subject = db.subjects.find(s => s.id === activeSubjectId);
    const topic = subject.topics.find(t => t.id === activeTopicId);
    
    let html = `
      <div style="padding: 0 4px;">
        <div style="margin: 16px 16px 8px 16px; display:flex; justify-content:space-between; align-items:center;">
          <button class="back-btn" onclick="goBack()">◀ BACK TO TOPICS</button>
          <span style="font-size:0.85rem; color:var(--text-muted);">${topic.name}</span>
        </div>
      </div>
    `;
    
    if (topic.quiz.length > 0) {
      html += `
        <div class="card" style="background:var(--accent); border-color:#5a4bcf; color:#fff;">
          <h3 style="margin-bottom:6px;">Ready to Practice?</h3>
          <p style="margin:0 0 12px 0; font-size:0.9rem; opacity:0.9;">Take the interactive quiz for this topic (${topic.quiz.length} questions available).</p>
          <button class="btn" style="background:#fff; color:var(--accent); border-color:#fff;" onclick="startQuizSession()">🚀 Take Quiz Now</button>
        </div>
      `;
    }

    html += `
      <div class="card">
        <h3>Topic Notes</h3>
        <textarea id="topic-notes" rows="6" placeholder="Paste your study notes here...">${topic.content}</textarea>
        <button class="btn btn-primary" onclick="saveNotes('${topic.id}')">Save Notes</button>
      </div>
    `;

    html += `<div class="card"><h3>Manage Quiz Questions (${topic.quiz.length})</h3>`;
    if (topic.quiz.length > 0) {
      topic.quiz.forEach((q, idx) => {
        html += `
          <div style="background:var(--bg-color); border:2px solid var(--thick-outline); padding:10px; border-radius:8px; margin-bottom:10px;">
            <div style="display:flex; justify-content:space-between; align-items:start;">
              <strong>Q${idx + 1}: ${q.question}</strong>
              <button class="btn btn-danger" style="width:auto; padding:4px 8px; margin:0; font-size:0.8rem;" onclick="deleteQuestion(${idx})">X</button>
            </div>
            <ul style="margin:6px 0 0 16px; padding:0; font-size:0.9rem; color:var(--text-muted);">
              ${q.options.map((opt, oIdx) => `<li style="color:${oIdx === q.correctIndex ? 'var(--green)' : 'inherit'};">${opt} ${oIdx === q.correctIndex ? '(Correct)' : ''}</li>`).join('')}
            </ul>
          </div>
        `;
      });
    } else {
      html += `<p style="color:var(--text-muted); font-size:0.9rem;">No questions added to this topic yet.</p>`;
    }
    html += `</div>`;

    html += `
      <div class="card">
        <h3>Add Question</h3>
        <label style="font-size:0.8rem; color:var(--text-muted);">Question Text</label>
        <input type="text" id="draft-q" value="${draftQuestion.question}" oninput="draftQuestion.question=this.value" placeholder="Enter question...">
        
        <label style="font-size:0.8rem; color:var(--text-muted);">Options (Select the correct one)</label>
    `;

    for (let i = 0; i < 4; i++) {
      html += `
        <div class="option-row">
          <input type="radio" name="correct-opt" ${draftQuestion.correctIndex === i ? 'checked' : ''} onclick="draftQuestion.correctIndex=${i}">
          <input type="text" value="${draftQuestion.options[i]}" oninput="draftQuestion.options[${i}]=this.value" placeholder="Option ${String.fromCharCode(65 + i)}">
        </div>
      `;
    }

    html += `
        <button class="btn btn-success" style="margin-top:12px;" onclick="addQuestionToTopic()">+ Save Question</button>
      </div>
    `;

    return html;
  }

  function buildQuizSession() {
    const subject = db.subjects.find(s => s.id === activeSubjectId);
    const topic = subject.topics.find(t => t.id === activeTopicId);

    if (quizIndex >= topic.quiz.length) {
      const percentage = Math.round((quizScore / topic.quiz.length) * 100);
      return `
        <div style="padding: 0 4px;">
          <div style="margin: 16px 16px 8px 16px;"><button class="back-btn" onclick="goBack()">◀ BACK TO TOPIC</button></div>
          <div class="card" style="text-align:center;">
            <h2>Quiz Complete! 🎉</h2>
            <p style="font-size: 1.5rem; font-weight:bold; color:var(--accent); margin: 20px 0;">Score: ${quizScore} / ${topic.quiz.length} (${percentage}%)</p>
            <button class="btn btn-primary" onclick="startQuizSession()">Retake Quiz</button>
            <button class="btn" style="margin-top:10px;" onclick="goBack()">Back to Topic</button>
          </div>
        </div>
      `;
    }

    const q = topic.quiz[quizIndex];
    let html = `
      <div style="padding: 0 4px;">
        <div style="margin: 16px 16px 8px 16px; display:flex; justify-content:space-between; align-items:center;">
          <button class="back-btn" onclick="goBack()">◀ QUIT QUIZ</button>
          <span style="font-size:0.85rem; color:var(--text-muted);">Question ${quizIndex + 1} of ${topic.quiz.length}</span>
        </div>
        <div class="card">
          <h3 style="margin-bottom:16px; font-size:1.1rem; line-height:1.4;">${q.question}</h3>
    `;

    q.options.forEach((opt, idx) => {
      let optClass = 'quiz-option';
      if (quizAnswered) {
        if (idx === q.correctIndex) optClass += ' correct';
        else if (idx === quizSelectedOpt) optClass += ' incorrect';
      } else if (quizSelectedOpt === idx) {
        optClass += ' selected';
      }

      html += `<div class="${optClass}" onclick="${quizAnswered ? '' : `quizSelectedOpt=${idx}; render();`}">${String.fromCharCode(65 + idx)}. ${opt}</div>`;
    });

    if (!quizAnswered) {
      html += `<button class="btn btn-primary" style="margin-top:16px;" ${quizSelectedOpt === null ? 'disabled style="opacity:0.5;"' : ''} onclick="submitQuizAnswer()">Submit Answer</button>`;
    } else {
      html += `<button class="btn btn-primary" style="margin-top:16px;" onclick="nextQuizQuestion()">Next Question ➔</button>`;
    }

    html += `</div></div>`;
    return html;
  }

  function submitQuizAnswer() {
    if (quizSelectedOpt === null) return;
    const subject = db.subjects.find(s => s.id === activeSubjectId);
    const topic = subject.topics.find(t => t.id === activeTopicId);
    const q = topic.quiz[quizIndex];

    if (quizSelectedOpt === q.correctIndex) {
      quizScore++;
    }
    quizAnswered = true;
    render();
  }

  function nextQuizQuestion() {
    quizIndex++;
    quizSelectedOpt = null;
    quizAnswered = false;
    render();
  }

  function buildCalculator() {
    let html = `<header><div></div><h1>Calculator</h1><div></div></header>`;
    html += `
      <div class="card">
        <input type="text" id="calc-display" readonly style="font-size:1.5rem; text-align:right;" placeholder="0">
        <div class="calc-grid">
          <button class="btn calc-btn" onclick="calcPress('7')">7</button>
          <button class="btn calc-btn" onclick="calcPress('8')">8</button>
          <button class="btn calc-btn" onclick="calcPress('9')">9</button>
          <button class="btn calc-btn btn-primary" onclick="calcPress('/')">÷</button>
          
          <button class="btn calc-btn" onclick="calcPress('4')">4</button>
          <button class="btn calc-btn" onclick="calcPress('5')">5</button>
          <button class="btn calc-btn" onclick="calcPress('6')">6</button>
          <button class="btn calc-btn btn-primary" onclick="calcPress('*')">×</button>
          
          <button class="btn calc-btn" onclick="calcPress('1')">1</button>
          <button class="btn calc-btn" onclick="calcPress('2')">2</button>
          <button class="btn calc-btn" onclick="calcPress('3')">3</button>
          <button class="btn calc-btn btn-primary" onclick="calcPress('-')">-</button>
          
          <button class="btn calc-btn btn-danger" onclick="calcClear()">C</button>
          <button class="btn calc-btn" onclick="calcPress('0')">0</button>
          <button class="btn calc-btn" onclick="calcPress('.')">.</button>
          <button class="btn calc-btn btn-primary" onclick="calcPress('+')">+</button>
        </div>
        <button class="btn btn-primary" style="margin-top:10px;" onclick="calcEval()">=</button>
      </div>
    `;
    return html;
  }

  let calcExpr = "";
  window.calcPress = (val) => { calcExpr += val; document.getElementById('calc-display').value = calcExpr; }
  window.calcClear = () => { calcExpr = ""; document.getElementById('calc-display').value = ""; }
  window.calcEval = () => { 
    try { 
      calcExpr = eval(calcExpr).toString(); 
      document.getElementById('calc-display').value = calcExpr; 
    } catch(e) { 
      document.getElementById('calc-display').value = "Error"; 
      calcExpr = ""; 
    } 
  }

  function buildSettings() {
    let html = `<header><div></div><h1>Settings</h1><div></div></header>`;
    html += `
      <div class="card">
        <h3>Data Management</h3>
        <p style="color:var(--text-muted); font-size:0.9rem;">Your study data is saved locally on this device.</p>
        <button class="btn btn-danger" onclick="clearAllData()">Reset All Data</button>
      </div>
    `;
    return html;
  }

  window.clearAllData = () => {
    if (confirm("Are you sure? This will delete all subjects, topics, and quizzes.")) {
      localStorage.removeItem('study_app_data');
      db = { subjects: [] };
      activeSubjectId = null;
      render();
    }
  }

  render();
</script>
</body>
</html>
