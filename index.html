<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline Study App</title>
<style>
  :root {
    --slate: #0b0d12;
    --charcoal: #131720;
    --accent: #8b7cff;
    --text: #f2f4f8;
    --muted: #9aa4b5;
    --line: #242936;
  }
  body {
    margin: 0; background: var(--slate); color: var(--text);
    font-family: sans-serif; padding-bottom: 70px;
  }
  .header { 
    padding: 16px; border-bottom: 1px solid var(--line); 
    font-weight: bold; text-align: center; letter-spacing: 1px;
  }
  .container { padding: 16px; }
  .card {
    background: var(--charcoal); padding: 16px; border-radius: 10px;
    margin-bottom: 12px; border: 1px solid var(--line);
  }
  h3 { margin: 0 0 5px 0; }
  .topic-hint { color: var(--muted); font-size: 0.85em; margin: 0; }
  
  /* Buttons */
  .btn-primary {
    width: 100%; padding: 12px; background: var(--accent); 
    color: #fff; border: none; border-radius: 8px; font-weight: bold;
  }
  
  /* Bottom Navigation */
  .bottom-nav {
    position: fixed; bottom: 0; width: 100%; display: flex;
    background: var(--charcoal); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    flex: 1; padding: 12px 4px; background: none; border: none;
    color: var(--muted); cursor: pointer; display: flex;
    flex-direction: column; align-items: center; gap: 4px;
    font-size: 0.75rem;
  }
  .nav-btn.active { color: var(--accent); }
  .icon { font-size: 1.2rem; }
</style>
</head>
<body>
  
  <div class="header" id="headerTitle">SUBJECTS</div>
  <div class="container" id="app"></div>
  
  <div class="bottom-nav">
    <button class="nav-btn" onclick="nav('calculator')" id="nav-calc">
      <span class="icon">🖩</span><span>Calculator</span>
    </button>
    <button class="nav-btn active" onclick="nav('subject')" id="nav-sub">
      <span class="icon">📓</span><span>Subjects</span>
    </button>
    <button class="nav-btn" onclick="nav('settings')" id="nav-set">
      <span class="icon">⚙️</span><span>Settings</span>
    </button>
  </div>

<script>
  let currentTab = 'subject';

  function nav(tab) {
    currentTab = tab;
    // Update active styles on the buttons
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    if(tab === 'calculator') document.getElementById('nav-calc').classList.add('active');
    if(tab === 'subject') document.getElementById('nav-sub').classList.add('active');
    if(tab === 'settings') document.getElementById('nav-set').classList.add('active');
    render();
  }

  function render() {
    const app = document.getElementById('app');
    const header = document.getElementById('headerTitle');
    app.innerHTML = '';
    
    if (currentTab === 'calculator') {
      header.innerText = 'CALCULATOR';
      app.innerHTML = '<div class="card">Your calculator panel will go here.</div>';
    
    } else if (currentTab === 'settings') {
      header.innerText = 'SETTINGS';
      app.innerHTML = '<div class="card">App settings and data export will go here.</div>';
    
    } else {
      header.innerText = 'SUBJECTS';
      // Placeholder data to show what the layout will look like
      app.innerHTML = `
        <div class="card">
          <h3>Professional Education</h3>
          <p class="topic-hint">Topics: Teacher Evaluation Frameworks, PPST</p>
        </div>
        <div class="card">
          <h3>Major in Mathematics</h3>
          <p class="topic-hint">Topics: Math Self-Efficacy, Research Variables</p>
        </div>
        <button class="btn-primary" onclick="alert('Add subject functionality coming next!')">+ Add New Subject</button>
      `;
    }
  }

  // Initial render when the page loads
  render();
</script>
</body>
  </html>
